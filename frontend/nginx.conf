# Serves the client, and passes the API and the game sockets to the server, like the dev proxy does.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8080;
    }

    location /ws/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    # The client's routes (/games/…, /join/…) are all served by index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Always revalidated, so a new build's bundles are picked up; the bundles' names change with their content.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
