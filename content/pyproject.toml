[project]
name = "shardbound-content"
version = "0.1.0"
description = "Checks for Shardbound's game content: card and deck schemas, card and deck rules, text templates."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "jsonschema>=4.23",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra"
