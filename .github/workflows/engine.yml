name: Engine

# Rules engine and game server. Runs when the engine, the content it loads, the rulebook its coverage test reads
# or this workflow change.
on:
  push:
    branches: [main]
    paths:
      - "engine/**"
      - "content/**"
      - "docs/rules/**"
      - ".github/workflows/engine.yml"
  pull_request:
    paths:
      - "engine/**"
      - "content/**"
      - "docs/rules/**"
      - ".github/workflows/engine.yml"
  workflow_dispatch:

jobs:
  engine-build:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and run all tests
        run: ./mvnw -B verify
