name: RAG smoke evaluation

# The main retrieval pipeline, scored on the dev questions and compared with the evaluation its commit records: the
# pull request fails when a run's Recall@10 lost more than 2 points. Runs when what retrieval reads or does changes.
# It writes the chunks (Java), starts Postgres with pgvector, embeds them on CPU (the models are cached from one run
# to the next), evaluates rrf-bm25-dense with and without the refs expansion and the MiniLM-L6 reranker, then runs
# python -m rag compare. A change meant to lower recall commits a new evaluation with it (scripts/evaluate.sh).
on:
  pull_request:
    paths:
      - "ai/rag/**"
      - "ai/pyproject.toml"
      - "ai/uv.lock"
      - "engine/core/src/main/**"
      - "engine/corpus/**"
      - "content/**"
      - "docs/rules/**"
      - "evals/**"
      - ".github/workflows/rag-smoke.yml"
  workflow_dispatch:

jobs:
  rag-smoke:
    name: Recall@10 against the recorded evaluation
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_USER: shardbound
          POSTGRES_PASSWORD: shardbound
          POSTGRES_DB: shardbound
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shardbound -d shardbound"
          --health-interval 2s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Cache the models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: models-${{ hashFiles('ai/rag/retrievers/dense/embedding_models.py', 'ai/rag/rerankers/minilm/minilm_reranker.py') }}

      - name: Write the chunks
        working-directory: engine
        run: ./mvnw -B -q -pl corpus -am compile exec:java

      - name: Index the chunks
        working-directory: ai
        run: uv run python -m rag index

      - name: Evaluate the main pipeline
        working-directory: ai
        run: >-
          uv run python -m rag evaluate rrf-bm25-dense --expanders refs --rerankers minilm-l6
          --description "CI smoke check of the main pipeline"

      - name: Compare with the recorded evaluation
        run: |
          new="$(git ls-files --others --exclude-standard evals/reports)"
          recorded="$(git ls-files "$(dirname "$new")" | sort | tail -n 1)"
          if [ -z "$recorded" ]; then
            echo "::notice::No evaluation recorded for $(dirname "$new") yet: nothing to compare with."
            exit 0
          fi
          echo "Recorded: $recorded"
          cd ai && uv run python -m rag compare "../$recorded" "../$new" --max-drop 2
