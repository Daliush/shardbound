name: Review

# Claude reviews each pull request with the repository's read-only review agents (.claude/agents/) and posts its
# findings on it: one comment per problem, on its line, and a summary. Needs the ANTHROPIC_API_KEY secret; without it,
# the job says so and passes.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    name: Claude review
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Look for the API key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No ANTHROPIC_API_KEY secret: the review is skipped."
          fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'
        with:
          fetch-depth: 0

      - name: Review the pull request
        if: steps.key.outputs.present == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE: ${{ github.event.pull_request.base.sha }}

            Review this pull request of Shardbound. AGENTS.md says how the project works: read it first.

            1. Read the change: `gh pr diff`, and `git diff BASE...HEAD` with the BASE above.
            2. Hand the change to each review agent of .claude/agents/ whose description matches the files it
               touches: rules-reviewer, eval-integrity-auditor, docs-sync-checker.
            3. Read the code as the maintainer would: the code style of the skill of each area touched, and the
               commit convention of AGENTS.md.

            Post one inline comment per real problem, on its line, with what is wrong and how to fix it, and a
            summary comment that lists them, the most serious first. Nothing about taste. When there is no problem,
            say so in the summary, with what was checked.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(python3 scripts/check-doc-paths.py),Read,Grep,Glob,Agent"
