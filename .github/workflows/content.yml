name: Content checks

# Card and deck schemas, card and deck rules, text templates. Runs whenever the game content or this workflow change.
on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - ".github/workflows/content.yml"
  pull_request:
    paths:
      - "content/**"
      - ".github/workflows/content.yml"
  workflow_dispatch:

jobs:
  content-tests:
    name: Cards, decks, text templates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: content
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Run content tests
        run: uv run pytest
