# Runs the game locally: docker compose up --build, then http://localhost:4200.
# One server instance only: its games live in memory (spec §13.4).
services:
  api:
    build:
      context: .
      dockerfile: engine/api/Dockerfile
    ports:
      - "8080:8080"

  web:
    build: frontend
    ports:
      - "4200:80"
    depends_on:
      - api
