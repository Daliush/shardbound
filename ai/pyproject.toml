[project]
name = "shardbound-ai"
version = "0.1.0"
description = "Shardbound's AI layer: the Arbiter's evaluation dataset, its RAG and, next, the eval harness."
requires-python = ">=3.12"
dependencies = [
    "bm25s>=0.3.13",
    "httpx>=0.27",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pystemmer>=3.1.0",
    "sentence-transformers>=6.1.0",
    "sqlalchemy>=2.1.4",
    "torch>=2.14.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv]
package = false

# The CPU build of torch on Windows and Linux too, where PyPI's carries CUDA (~2 GB): the models run on the CPU by
# default, and every machine, CI included, gets the same light install. A GPU build lives in .venv-gpu (ai/README.md). macOS wheels are CPU builds already.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --import-mode=importlib"
