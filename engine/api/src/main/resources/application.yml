spring:
  application:
    name: shardbound
  threads:
    virtual:
      enabled: true

# Cloud Run gives the port in PORT.
server:
  port: ${PORT:8080}

# See spec §3.4. shardbound.content-dir is found by walking up from the working directory when not set, and
# shardbound.reports-dir and shardbound.datasets-dir, the Arbiter's evaluations and their datasets, are then the
# repository's evals/reports and evals/datasets, and shardbound.art-dir, the cards' art, its assets/art/web.
shardbound:
  sessions:
    finished-ttl: 30m
    idle-ttl: 2h
  bots:
    step-delay: 0ms
